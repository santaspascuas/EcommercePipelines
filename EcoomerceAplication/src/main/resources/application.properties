spring.application.name=EcoomerceAplication
spring.profiles.active=dev
# H2 en memoria con modo PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway deshabilitado en dev (H2 — Hibernate gestiona el esquema)
spring.flyway.enabled=false

logging.level.com.AplicatioEcommerce=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.SQL=DEBUG

#JwUtiles
JwtUtil.expirationtime=${JWT_EXPIRATION_TIME:7200000}
JwtUtil.secretkey=${JWT_SECRET_KEY:843567893696976453275974432697R634976R738467TR678T34865R6834R8763T478378637664538745673865783678548735687R3}
#Cookies
app.cookie.secure=true
app.cookie.name=jwt
app.cookie.max-age=1800
